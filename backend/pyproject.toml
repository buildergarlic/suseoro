[project]
name = "suseoro-v2"
version = "0.1.0"
description = "Suseoro v2 acquisition workflow service"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<0.120",
    "openpyxl>=3.1,<4",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
    "python-calamine>=0.5,<0.7",
    "rapidfuzz>=3.10,<4",
    "tzdata>=2025.2",
    "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "odfpy>=1.4,<2",
    "pytest>=8.3,<9.0",
    "xlwt>=1.3,<2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
# FastAPI intentionally represents dependency injection with call-valued defaults.
ignore = ["B008"]

[tool.hatch.build.targets.wheel]
packages = ["src/suseoro"]

[tool.hatch.build]
include = ["src/suseoro/**/*.py", "src/suseoro/db/migrations/*.sql"]
