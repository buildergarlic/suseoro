<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수서로 업데이트 진단</title></head>
<body><main><h1>수서로 업데이트 진단 수신</h1><p>수서로의 업데이트 오류 보고를 받는 공식 수신 경로입니다. 도서 목록, 학교 이름, 사용자 계정, 인증키는 수집하지 않습니다.</p><p>수서로의 학교 설정에서 자동 오류 보고를 켜거나 끌 수 있습니다.</p></main>
<form name="update-errors" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="update-errors">
  <input type="hidden" name="subject" value="수서로 자동 업데이트 오류">
  <input type="text" name="name"><input type="email" name="email">
  <input name="bot-field"><input name="version"><input name="stage"><input name="category"><input name="code"><input name="install_id"><input name="occurred_at"><textarea name="report"></textarea>
</form></body></html>
