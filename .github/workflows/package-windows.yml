name: Package Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (must match source)
        required: true
        default: '2.2.4'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Backend dependencies
        working-directory: backend
        run: uv sync --locked --extra desktop
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Build offline user guides
        run: uv run scripts/build-user-guide.py --zip
      - name: Fetch official portable NSIS
        shell: pwsh
        run: |
          New-Item -ItemType Directory .tools/nsis -Force | Out-Null
          $expected = '56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f'
          $verified = $false
          foreach ($mirror in @(
            'https://distfiles.macports.org/nsis/nsis-3.12.zip',
            'https://mirrors.mit.edu/macports/distfiles/nsis/nsis-3.12.zip'
          )) {
            try {
              Invoke-WebRequest $mirror -OutFile .tools/nsis.zip
              if ((Get-FileHash .tools/nsis.zip -Algorithm SHA256).Hash.ToLowerInvariant() -eq $expected) {
                $verified = $true
                break
              }
              Write-Warning "NSIS checksum mismatch from $mirror"
            }
            catch { Write-Warning "NSIS download failed from ${mirror}: $_" }
          }
          if (-not $verified) { throw 'Could not download checksum-verified NSIS 3.12' }
          Expand-Archive .tools/nsis.zip .tools/nsis
      - name: Build and smoke-test application
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: ./scripts/build-desktop.ps1 -Version $env:PACKAGE_VERSION -TesseractDir ./portable_tesseract -PortableZip
      - name: Verify automatic installer lifecycle
        run: uv run scripts/test-installer-auto-update.py --makensis .tools/nsis/nsis-3.12/makensis.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Suseoro-Windows
          path: |
            dist/Suseoro-Setup-*.exe
            dist/Suseoro-Portable-*.zip
            dist/Suseoro-Guide-*.zip
            dist/*.sha256
            dist/SHA256SUMS
          if-no-files-found: error
